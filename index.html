<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Hub by Kévin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
    :root {
        --stage: #181829;
        --ink: #20202f;
        --ink-soft: #3a3a4a;
        --cream: #fdf6e9;
        --card: #fffaf0;
        --ui-blue: #3498db;
        --font-display: 'Baloo 2', cursive;
        --font-body: 'Nunito', 'Segoe UI', Arial, sans-serif;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        font-family: var(--font-body);
        background-color: var(--stage);
        background-image:
            radial-gradient(circle at 15% 15%, rgba(52,152,219,0.16), transparent 35%),
            radial-gradient(circle at 85% 80%, rgba(232,67,147,0.14), transparent 35%),
            linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
        background-size: auto, auto, 42px 42px, 42px 42px;
        color: var(--cream);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px 20px 60px;
    }

    header {
        text-align: center;
        margin-bottom: 44px;
    }

    .logo {
        font-family: var(--font-display);
        font-size: 2.8em;
        font-weight: 800;
        letter-spacing: 0.5px;
        color: #ffffff;
        text-shadow: 5px 5px 0 var(--ui-blue);
        margin-bottom: 0;
    }

    .logo::after {
        content: '';
        display: block;
        width: 170px;
        height: 6px;
        margin: 18px auto 0;
        border-radius: 3px;
        background: linear-gradient(90deg, #3498db, #e84393, #f1c40f, #16a085, #9b59b6, #e67e22, #ef5b50);
    }

    .tagline {
        color: var(--cream);
        font-size: 1.1em;
        font-weight: 600;
        margin-top: 18px;
    }

    .games-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 26px;
        max-width: 1100px;
        width: 100%;
    }

    .game-card {
        display: flex;
        flex-direction: column;
        background: var(--card);
        border: 3px solid var(--ink);
        border-top: 8px solid var(--accent, var(--ui-blue));
        border-radius: 14px;
        padding: 26px 22px;
        text-decoration: none;
        color: var(--ink);
        box-shadow: 6px 6px 0 rgba(10,10,20,0.45);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .game-card:hover {
        transform: translate(-4px, -4px);
        box-shadow: 10px 10px 0 rgba(10,10,20,0.45);
    }

    .game-card:active {
        transform: translate(0, 0);
        box-shadow: 3px 3px 0 rgba(10,10,20,0.4);
    }

    .game-icon-wrap {
        width: 58px;
        height: 58px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--accent, var(--ui-blue));
        border: 2px solid var(--ink);
        border-radius: 12px;
        color: var(--ink);
        margin-bottom: 16px;
    }

    .game-icon-wrap svg {
        width: 32px;
        height: 32px;
    }

    .game-title {
        font-family: var(--font-display);
        font-size: 1.35em;
        font-weight: 700;
        color: var(--ink);
        margin-bottom: 8px;
    }

    .game-description {
        color: var(--ink-soft);
        font-size: 0.95em;
        line-height: 1.45;
        flex-grow: 1;
        margin-bottom: 18px;
    }

    .game-play {
        display: inline-flex;
        align-self: flex-start;
        align-items: center;
        gap: 6px;
        background: var(--accent, var(--ui-blue));
        color: var(--ink);
        border: 2px solid var(--ink);
        border-radius: 8px;
        padding: 9px 20px;
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 0.95em;
        box-shadow: 3px 3px 0 rgba(10,10,20,0.35);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .game-card:hover .game-play {
        transform: translate(-2px, -2px);
        box-shadow: 5px 5px 0 rgba(10,10,20,0.4);
    }

    footer {
        margin-top: 50px;
        color: var(--cream);
        font-weight: 600;
        font-size: 0.9em;
        text-align: center;
    }
</style>
</head>
<body>
    <header>
        <div class="logo">Game Hub by Kévin</div>
        <p class="tagline">Choisis ton jeu et lance la soirée</p>
    </header>

    <div class="games-grid" id="gamesGrid"></div>

    <footer id="footerCount"></footer>

    <script>
        const ICONS = {
            dice: '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="7" width="34" height="34" rx="8"/><circle cx="16.5" cy="16.5" r="2.2" fill="currentColor" stroke="none"/><circle cx="31.5" cy="16.5" r="2.2" fill="currentColor" stroke="none"/><circle cx="24" cy="24" r="2.2" fill="currentColor" stroke="none"/><circle cx="16.5" cy="31.5" r="2.2" fill="currentColor" stroke="none"/><circle cx="31.5" cy="31.5" r="2.2" fill="currentColor" stroke="none"/></svg>',
            music: '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="17" cy="33" r="6"/><circle cx="33" cy="27" r="6"/><path d="M23 33V15l16-4v18"/></svg>',
            bolt: '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M26 5L11 27h9l-3 16 20-25h-10l4-13z"/></svg>',
            clock: '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="24" r="17"/><path d="M24 14v10l7 5"/></svg>',
            key: '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="16" cy="24" r="8.5"/><path d="M23.5 24H41M33 24v6M39 24v6"/></svg>',
            grid: '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="7" width="15" height="15" rx="3"/><rect x="26" y="7" width="15" height="15" rx="3"/><rect x="7" y="26" width="15" height="15" rx="3"/><rect x="26" y="26" width="15" height="15" rx="3"/></svg>',
            camera: '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="15" width="38" height="25" rx="4"/><path d="M17 15l3-6h8l3 6"/><circle cx="24" cy="27" r="7.5"/></svg>',
            bars: '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="28" width="9" height="13" rx="2"/><rect x="20" y="18" width="9" height="23" rx="2"/><rect x="33" y="7" width="9" height="34" rx="2"/></svg>'
        };

        // Ajouter un jeu = ajouter une entrée ici. "folder" doit correspondre au nom exact du dossier contenant son index.html
        // (minuscules, sans espaces, accents ni apostrophes : le serveur en ligne respecte la casse, contrairement à Windows).
        // "icon" doit référencer une clé de ICONS ci-dessus (ou en ajouter une nouvelle dans le même style de trait).
        const GAMES = [
            {
                folder: 'la-grille',
                title: 'La Grille',
                icon: 'dice',
                color: '#3498db',
                description: "Grille de cases à mémoriser, avec des questions à thème et à difficulté générées avec l'IA."
            }
        ];

        function renderGames() {
            const grid = document.getElementById('gamesGrid');
            grid.innerHTML = '';

            GAMES.forEach(game => {
                const card = document.createElement('a');
                card.className = 'game-card';
                card.href = encodeURIComponent(game.folder) + '/index.html';
                card.style.setProperty('--accent', game.color);

                const iconWrap = document.createElement('div');
                iconWrap.className = 'game-icon-wrap';
                iconWrap.innerHTML = ICONS[game.icon] || '';

                const title = document.createElement('div');
                title.className = 'game-title';
                title.textContent = game.title;

                const desc = document.createElement('div');
                desc.className = 'game-description';
                desc.textContent = game.description;

                const play = document.createElement('div');
                play.className = 'game-play';
                play.textContent = 'Jouer ▶';

                card.appendChild(iconWrap);
                card.appendChild(title);
                card.appendChild(desc);
                card.appendChild(play);
                grid.appendChild(card);
            });

            document.getElementById('footerCount').textContent = `${GAMES.length} jeu(x) disponible(s)`;
        }

        renderGames();
    </script>
</body>
</html>
